# =============================================================
#  Docker Compose — Portal Somos VEPAGOS
# =============================================================
#  Uso:
#    docker compose up -d --build
#    Abrir http://localhost:3000 → Portal
# =============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vepagos-app
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORTAL_PATH: /app/portal
