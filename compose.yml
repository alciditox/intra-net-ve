# =============================================================
#  Docker Compose — Portal Somos VEPAGOS
# =============================================================
#  Uso:
#    docker compose up -d --build
#    Abrir http://localhost:3000 → Portal
# =============================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: 6

networks:
  database:
    name: database
    external: true
  proxy:
    name: proxy
    external: true

services:
  nginx:
    image: nginx:alpine
    container_name: intranet-nginx
    restart: unless-stopped
    tty: true
    ports:
      - "${APP_PORT:-8098}:80"
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - intranet
    networks:
      - proxy
    logging: *default-logging

  intranet:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWWUSER: ${HOST_UID:-1000}
        WWWGROUP: ${HOST_GID:-1000}
    image: ${DOCKER_IMAGE:-intranet-php:latest}
    container_name: intranet-app
    env_file:             # <--- AGREGA ESTO
      - .env              # <--- AGREGA ESTO
    networks:             # <--- AGREGA ESTO
      - proxy             # Para que se hable con Nginx
      - database          # Para que alcance al host 'db' de MySQL
